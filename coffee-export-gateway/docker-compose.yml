version: '3.8'

services:
  gateway:
    build: .
    container_name: coffee-export-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=8f3a9b2c7d1e6f4a5b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
      - JWT_EXPIRES_IN=24h
      - CHANNEL_NAME=coffeechannel
      - CHAINCODE_NAME=ecta
      - FABRIC_NETWORK_AS_LOCALHOST=false
      - CA_ADMIN_USER=admin
      - CA_ADMIN_PASSWORD=adminpw
      - ORG_NAME=ECTAOrg
      - ORG_MSP_ID=ECTAOrgMSP
      - ECTA_SERVICE_URL=http://coffee-ecta:3003
      - DB_HOST=coffee-postgres
      - DB_PORT=5432
      - DB_NAME=coffee_export
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
    volumes:
      - ./wallets:/app/wallets
      - ../../crypto-config:/app/crypto-config:ro
    networks:
      - fabric-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  fabric-network:
    external: true
